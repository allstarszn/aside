# The Slack app aside connects to.
#
# Create it at api.slack.com/apps with "From a manifest", paste this, then
# Install to Workspace. The resulting User OAuth Token starts xoxp-.
#
# Two errors this flow throws that are not manifest problems:
#
#   "You're creating apps too quickly"  -> Slack rate limits app creation after a
#   few attempts. Wait a minute and press Create and Install again.
#
#   "Installation was not completed"    -> the separate authorization page did not
#   finish, usually because it was popup-blocked or closed. Allow the popup, or
#   skip the wizard: the app already exists, so open it from Your Apps, go to
#   OAuth & Permissions, and use Install to Workspace there instead.
#
# Everything below is a USER scope, deliberately. A user token posts under the
# person's own name; a bot token posts as the app with an "APP" badge next to
# it, which is not what anyone wants their reply to look like.
display_information:
  name: aside
  description: Your notes and every messenger, on the edge of your screen
  background_color: "#12110f"

oauth_config:
  # Where Slack sends someone back after they approve. Set here rather than
  # added by hand afterwards: it must match what aside sends BYTE FOR BYTE or
  # Slack answers bad_redirect_uri, and a typed URL is a place to get it wrong.
  redirect_urls:
    - https://aside-landing-two.vercel.app/api/slack/callback

  scopes:
    user:
      # Post as the person.
      - chat:write
      # Turn a channel NAME from a notification into the ID the API needs.
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      # Read real conversation history rather than only what a notification said.
      # Included now so the app does not have to be reinstalled to add them later.
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      # Turn the user id on a message into a person's name. Without this every
      # sender in a Slack thread renders blank, because Slack never puts a name
      # on the message itself.
      - users:read

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_hosted: false
