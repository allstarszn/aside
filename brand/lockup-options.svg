<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- The approved mark: screen with the drawer pulled out past the frame -->
    <g id="mark">
      <rect x="10" y="26" width="66" height="52" rx="13" fill="#F6F2EA"/>
      <rect x="56" y="34" width="36" height="36" rx="12" fill="#3FA47C"/>
    </g>
  </defs>

  <rect width="1400" height="1400" fill="#12110F"/>

  <text x="64" y="74" font-size="30" font-weight="600" fill="#F6F2EA">Merging the mark and the word</text>
  <text x="64" y="110" font-size="17" fill="#8A857D">Same mark, same SF Pro. Three ways to make them one object instead of two things side by side.</text>

  <!-- 1. ENCLOSED: the word sits on the screen, drawer pulled out past its edge -->
  <text x="64" y="176" font-size="13" font-weight="600" letter-spacing="2" fill="#6E6A64">1. ENCLOSED</text>
  <rect x="64" y="196" width="1248" height="240" rx="18" fill="#1B1916"/>
  <g transform="translate(150, 256)">
    <rect x="0" y="0" width="300" height="120" rx="34" fill="#F6F2EA"/>
    <text x="126" y="80" font-size="66" font-weight="600" letter-spacing="-2.5" fill="#12110F" text-anchor="middle">aside</text>
    <rect x="248" y="20" width="84" height="80" rx="28" fill="#3FA47C"/>
  </g>
  <text x="620" y="300" font-size="16" fill="#C9C4BB">The word IS the note on the screen, and the drawer is pulled out past it.</text>
  <text x="620" y="326" font-size="16" fill="#8A857D">Truest merge: one silhouette, and the mark is literally the container.</text>
  <text x="620" y="360" font-size="15" fill="#8A857D">Risk: a filled plate can read as a button rather than a logo.</text>

  <!-- 2. INLINE: the drawer slides out of the word itself -->
  <text x="64" y="500" font-size="13" font-weight="600" letter-spacing="2" fill="#6E6A64">2. INLINE</text>
  <rect x="64" y="520" width="1248" height="240" rx="18" fill="#1B1916"/>
  <g transform="translate(150, 580)">
    <text x="0" y="82" font-size="72" font-weight="600" letter-spacing="-3" fill="#F6F2EA">aside</text>
    <rect x="196" y="26" width="30" height="62" rx="14" fill="#3FA47C"/>
  </g>
  <text x="620" y="624" font-size="16" fill="#C9C4BB">The word is the screen, the drawer slides out of its right edge.</text>
  <text x="620" y="650" font-size="16" fill="#8A857D">Lightest on a dark page, no heavy plate.</text>
  <text x="620" y="684" font-size="15" fill="#C4553D">Risk: sits where the period sat, so it may still echo commit.</text>

  <!-- 3. LOCKUP: mark and word as one tightly set unit -->
  <text x="64" y="824" font-size="13" font-weight="600" letter-spacing="2" fill="#6E6A64">3. LOCKUP</text>
  <rect x="64" y="844" width="1248" height="240" rx="18" fill="#1B1916"/>
  <g transform="translate(150, 890)">
    <g transform="scale(1.5)"><use href="#mark"/></g>
    <text x="164" y="104" font-size="72" font-weight="600" letter-spacing="-3" fill="#F6F2EA">aside</text>
  </g>
  <text x="620" y="948" font-size="16" fill="#C9C4BB">The conventional answer: mark and word set as one unit.</text>
  <text x="620" y="974" font-size="16" fill="#8A857D">Most flexible, splits cleanly for the app icon and the favicon.</text>
  <text x="620" y="1008" font-size="15" fill="#8A857D">Risk: still reads as two things next to each other, not merged.</text>

  <!-- Small sizes -->
  <rect x="64" y="1124" width="1248" height="1" fill="#2A2823"/>
  <text x="64" y="1176" font-size="13" font-weight="600" letter-spacing="2" fill="#6E6A64">EACH ONE AT MENU BAR SIZE</text>
  <g transform="translate(64, 1210)">
    <rect x="0" y="0" width="300" height="60" rx="17" fill="#F6F2EA"/>
    <text x="126" y="40" font-size="33" font-weight="600" letter-spacing="-1.2" fill="#12110F" text-anchor="middle">aside</text>
    <rect x="248" y="10" width="42" height="40" rx="14" fill="#3FA47C"/>
  </g>
  <g transform="translate(440, 1210)">
    <text x="0" y="42" font-size="36" font-weight="600" letter-spacing="-1.5" fill="#F6F2EA">aside</text>
    <rect x="98" y="13" width="15" height="31" rx="7" fill="#3FA47C"/>
  </g>
  <g transform="translate(760, 1214)">
    <g transform="scale(0.75)"><use href="#mark"/></g>
    <text x="82" y="52" font-size="36" font-weight="600" letter-spacing="-1.5" fill="#F6F2EA">aside</text>
  </g>
</svg>
